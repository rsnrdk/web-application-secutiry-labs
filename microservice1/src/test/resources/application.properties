# Test profile: in-memory H2 instead of PostgreSQL, no Keycloak needed
spring.datasource.url=jdbc:h2:mem:websec;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.security.oauth2.client.registration.keycloak.client-id=websec-ui
spring.security.oauth2.client.registration.keycloak.client-secret=test-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:8081/realms/websec/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8081/realms/websec/protocol/openid-connect/token

jwt.secret=test-secret-key-for-jwt-which-is-long-enough-123456
jwt.expiration-ms=3600000

# Quartz: schedule is stored in the database (QRTZ_* tables created by Liquibase, not by Spring Boot)
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.overwrite-existing-jobs=true
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.threadPool.threadCount=2
scheduling.time-zone=Europe/Kyiv
# tests trigger jobs explicitly, the scheduler must not fire by the real clock
spring.quartz.auto-startup=false

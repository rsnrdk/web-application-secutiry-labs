services:

  postgres:
    image: postgres:17
    container_name: websec-postgres
    environment:
      POSTGRES_DB: websec
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: websec-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  app:
    build: .
    container_name: websec-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/websec
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      JWT_SECRET: my-super-secret-key-for-jwt-which-is-long-enough
      JWT_EXPIRATION_MS: 86400000

volumes:
  postgres_data:
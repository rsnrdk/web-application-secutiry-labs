databaseChangeLog:

  - changeSet:
      id: 007-create-activity-report
      author: rsnrdk
      changes:

        - createTable:
            tableName: activity_report
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: report_date
                  type: DATE
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_activity_report_date

              - column:
                  name: total_requests
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: unique_users
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: error_requests
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: generated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

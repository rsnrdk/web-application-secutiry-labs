spring.application.name=websec
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/websec
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public

spring.security.oauth2.client.registration.keycloak.client-id=websec-ui
spring.security.oauth2.client.registration.keycloak.client-secret=l5qHFCE6arS1af5GUXf0b2lQd88odTvZ2cjxJPGHSDL59aQoSJbtVyzPC3bNJPpvVif08tps8Lun4IgTPStT7A
spring.security.oauth2.client.registration.keycloak.scope[0]=openid
spring.security.oauth2.client.registration.keycloak.scope[1]=profile
spring.security.oauth2.client.registration.keycloak.scope[2]=email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/websec

jwt.secret=a560d38f2b4f430eba2dece38f5c8c87dd019b243b93bcbe4a16d09681edb5ae
jwt.expiration-ms=86400000

# Quartz: schedule is stored in the database (QRTZ_* tables created by Liquibase, not by Spring Boot)
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.overwrite-existing-jobs=true
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.threadPool.threadCount=2
scheduling.time-zone=Europe/Kyiv

databaseChangeLog:

  - changeSet:
      id: 003-create-audit-log
      author: rsnrdk
      changes:

        - createTable:
            tableName: audit_log
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: ip
                  type: VARCHAR(255)

              - column:
                  name: method
                  type: VARCHAR(255)

              - column:
                  name: status
                  type: INT

              - column:
                  name: uri
                  type: VARCHAR(255)

              - column:
                  name: username
                  type: VARCHAR(255)